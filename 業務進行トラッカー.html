<script type="module">
const TEMPLATES = {
  generic: { name: '汎用（シンプル）', steps: ['計画', '準備', '実行', '確認', '報告', '振り返り'] },
  cae: { name: 'CAE解析', steps: ['目的・解析計画', '打ち合わせ', '条件検討', 'CAE実行', '結果整理', '考察', '報告書', '振り返り'] },
  sales: { name: '商談・提案', steps: ['目的・方針検討', '顧客打ち合わせ', '提案内容検討', '資料作成', '提案・商談実施', 'フィードバック整理', '社内報告', '振り返り'] },
  doc: { name: '資料・報告作成', steps: ['目的整理', '構成検討', '打ち合わせ', 'ドラフト作成', 'レビュー', '修正', '最終化・提出', '振り返り'] },
};
const TEMPLATE_ORDER = ['generic', 'cae', 'sales', 'doc'];

function freshStepsFor(templateKey, seqRef) {
  const t = TEMPLATES[templateKey] || TEMPLATES.generic;
  return t.steps.map((label) => {
    seqRef.n += 1;
    return { id: 's' + seqRef.n, label, status: 'pending', start: '', end: '' };
  });
}

function defaultState() {
  const seqRef = { n: 100 };
  const steps = freshStepsFor('generic', seqRef);
  return {
    templateId: 'generic',
    theme: '',
    steps,
    counters: [
      { id: 'c1', label: '打ち合わせ回数', value: 0 },
      { id: 'c2', label: 'やり直し回数', value: 0 },
      { id: 'c3', label: '手戻り回数', value: 0 },
    ],
    _seq: seqRef.n,
    updatedAt: null,
  };
}

let state = defaultState();
let db = null;
let userCap = null;
let downloadsCap = null;
let readOnly = false;
let dbAvailable = false;
let armed = null;
let armedTimer = null;

const root = document.getElementById('app');

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function nextId(prefix) {
  state._seq = (state._seq || 0) + 1;
  return prefix + state._seq;
}

function arm(key) {
  if (armed === key) {
    clearTimeout(armedTimer);
    armed = null;
    return true;
  }
  armed = key;
  clearTimeout(armedTimer);
  armedTimer = setTimeout(() => { armed = null; render(); }, 4000);
  render();
  return false;
}

let pendingWrites = 0;
let writeTail = Promise.resolve();

async function persist(next) {
  state = next;
  state.updatedAt = new Date().toISOString();
  render();
  if (!db) return;
  pendingWrites += 1;
  const ref = db.doc('state/current');
  const snapshotToWrite = state;
  const myWrite = writeTail.then(() => ref.set(snapshotToWrite));
  writeTail = myWrite.catch(() => {}); // never let one failure poison later writes
  try {
    await myWrite;
    if (readOnly) { readOnly = false; render(); }
  } catch (e) {
    readOnly = true;
    render();
  } finally {
    pendingWrites = Math.max(0, pendingWrites - 1);
  }
}

// ---- step actions ----
function startStep(id) {
  const steps = state.steps.map((s) => (s.id === id ? { ...s, status: 'active', start: s.start || todayStr() } : s));
  persist({ ...state, steps });
}
function completeStep(id) {
  if (!arm('complete:' + id)) return;
  const steps = state.steps.map((s) => (s.id === id ? { ...s, status: 'done', end: s.end || todayStr() } : s));
  persist({ ...state, steps });
}
function revertStep(id) {
  const steps = state.steps.map((s) => (s.id === id ? { ...s, status: 'pending' } : s));
  persist({ ...state, steps });
}
function setStepDate(id, field, value) {
  const steps = state.steps.map((s) => (s.id === id ? { ...s, [field]: value } : s));
  persist({ ...state, steps });
}
function setStepLabel(id, value) {
  const steps = state.steps.map((s) => (s.id === id ? { ...s, label: value.slice(0, 60) } : s));
  persist({ ...state, steps });
}
function addStep() {
  const steps = [...state.steps, { id: nextId('s'), label: '新しいステップ', status: 'pending', start: '', end: '' }];
  persist({ ...state, steps });
}
function deleteStep(id) {
  if (!arm('delete-step:' + id)) return;
  const steps = state.steps.filter((s) => s.id !== id);
  persist({ ...state, steps });
}
function moveStep(id, dir) {
  const i = state.steps.findIndex((s) => s.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= state.steps.length) return;
  const steps = state.steps.slice();
  [steps[i], steps[j]] = [steps[j], steps[i]];
  persist({ ...state, steps });
}
function applyTemplate(key) {
  if (!arm('apply-template:' + key)) return;
  const seqRef = { n: state._seq || 100 };
  const steps = freshStepsFor(key, seqRef);
  persist({ ...state, templateId: key, steps, _seq: seqRef.n });
}

// ---- counter actions ----
function bumpCounter(id, delta) {
  const counters = state.counters.map((c) => (c.id === id ? { ...c, value: Math.max(0, c.value + delta) } : c));
  persist({ ...state, counters });
}
function setCounterLabel(id, value) {
  const counters = state.counters.map((c) => (c.id === id ? { ...c, label: value.slice(0, 40) } : c));
  persist({ ...state, counters });
}
function addCounter() {
  const counters = [...state.counters, { id: nextId('c'), label: '新しいカウンター', value: 0 }];
  persist({ ...state, counters });
}
function deleteCounter(id) {
  if (!arm('delete-counter:' + id)) return;
  const counters = state.counters.filter((c) => c.id !== id);
  persist({ ...state, counters });
}
function resetCounters() {
  if (!arm('reset:counters')) return;
  const counters = state.counters.map((c) => ({ ...c, value: 0 }));
  persist({ ...state, counters });
}
function resetProgress() {
  if (!arm('reset:progress')) return;
  const steps = state.steps.map((s) => ({ ...s, status: 'pending', start: '', end: '' }));
  persist({ ...state, steps });
}
function setTheme(value) {
  persist({ ...state, theme: value.slice(0, 60) });
}

// ---- export ----
function docStyle() {
  return '<style>body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#0f172a;padding:32px;max-width:720px;margin:0 auto;}' +
    'h1{font-size:20px;border-bottom:3px solid #2563eb;padding-bottom:8px;}' +
    'h2{font-size:15px;color:#2563eb;margin-top:24px;}' +

// ---- chart palettes (fixed categorical order; status colors stay reserved) ----
const LIVE_PALETTE = {
  pending: 'var(--status-pending)', active: 'var(--status-active)', done: 'var(--status-done)',
  accent: 'var(--accent)', hole: 'var(--surface)', text: 'var(--text-primary)',

  accent: '#2563eb', hole: '#ffffff', text: '#0f172a',
  muted: '#94a3b8', grid: '#d9e2ec',
  categorical: ['#2563eb', '#7c3aed', '#0d9488', '#ea580c', '#db2777', '#475569'],

const CHART_CSS = '.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}' +
  '.chart-block{display:flex;flex-direction:column;gap:8px;}' +

  '.chart-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}' +
  '.chart-svg{width:100%;max-width:220px;height:auto;overflow:visible;}' +
  '.chart-svg-bar{max-width:100%;}' +
  '.chart-legend{display:flex;flex-direction:column;gap:5px;font-size:11.5px;}' +
  '.chart-legend-item{display:flex;align-items:center;gap:6px;}' +
  '.chart-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;}' +
  '.chart-empty{font-size:12px;color:#94a3b8;padding:10px 0;}';

function pieChartHTML(items, title, palette) {
  const total = items.reduce((s, i) => s + i.value, 0);
  const cx = 70, cy = 70, r = 62, rInner = 38;
  let a = -Math.PI / 2;
  let paths = '';
  if (total > 0) {
    items.forEach((it) => {
      const frac = it.value / total;
      if (frac <= 0) return;
      const a0 = a, a1 = a + frac * 2 * Math.PI;
      const x0 = (cx + r * Math.cos(a0)).toFixed(2), y0 = (cy + r * Math.sin(a0)).toFixed(2);
      const x1 = (cx + r * Math.cos(a1)).toFixed(2), y1 = (cy + r * Math.sin(a1)).toFixed(2);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      paths += '<path d="M' + cx + ',' + cy + ' L' + x0 + ',' + y0 + ' A' + r + ',' + r + ' 0 ' + large + ' 1 ' + x1 + ',' + y1 + ' Z" style="fill:' + it.color + '" stroke="' + palette.hole + '" stroke-width="2"></path>';
      a = a1;
    });
  }
  const hole = '<circle cx="' + cx + '" cy="' + cy + '" r="' + rInner + '" style="fill:' + palette.hole + '"></circle>';
  const centerText = total > 0
    ? '<text x="' + cx + '" y="' + (cy - 3) + '" text-anchor="middle" font-size="18" font-weight="700" style="fill:' + palette.text + '">' + total + '</text><text x="' + cx + '" y="' + (cy + 13) + '" text-anchor="middle" font-size="9" style="fill:' + palette.muted + '">件</text>'
    : '<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="10" style="fill:' + palette.muted + '">データなし</text>';
  const legend = items.map((it) => '<div class="chart-legend-item"><span class="chart-dot" style="background:' + it.color + '"></span>' + esc(it.label) + '：' + it.value + '件' + (total ? '（' + Math.round(it.value / total * 100) + '%）' : '') + '</div>').join('');
  return '<div class="chart-block"><div class="chart-title">' + title + '</div><div class="chart-wrap"><svg viewBox="0 0 140 140" class="chart-svg">' + paths + hole + centerText + '</svg><div class="chart-legend">' + legend + '</div></div></div>';
}

function barChartHTML(items, title, palette) {
  if (!items.length) return '<div class="chart-block"><div class="chart-title">' + title + '</div><div class="chart-empty">データがありません</div></div>';
  const max = Math.max(1, ...items.map((i) => i.value));
  const barH = 20, gap = 12, chartW = 230;
  const rows = items.map((it, i) => {
    const y = i * (barH + gap + 14);
    const w = Math.max(2, Math.round((it.value / max) * chartW));
    return '<g transform="translate(0,' + y + ')">' +
      '<text x="0" y="10" font-size="11" style="fill:' + palette.text + '">' + esc(it.label) + '</text>' +
      '<rect x="0" y="16" width="' + chartW + '" height="' + barH + '" rx="5" style="fill:' + palette.grid + '" opacity="0.5"></rect>' +
      '<rect x="0" y="16" width="' + w + '" height="' + barH + '" rx="5" style="fill:' + it.color + '"></rect>' +
      '<text x="' + (w + 8) + '" y="' + (16 + barH / 2 + 4) + '" font-size="12" font-weight="700" style="fill:' + palette.text + '">' + it.value + '</text>' +
      '</g>';
  }).join('');
  const totalH = items.length * (barH + gap + 14) + 6;
  return '<div class="chart-block"><div class="chart-title">' + title + '</div><svg viewBox="0 0 280 ' + totalH + '" class="chart-svg chart-svg-bar" preserveAspectRatio="xMinYMin meet">' + rows + '</svg></div>';
}

function lineChartHTML(series, title, palette) {
  if (series.length < 2) {
    return '<div class="chart-block"><div class="chart-title">' + title + '</div><div class="chart-empty">完了日が入力済みのステップが2件以上になると表示されます</div></div>';
  }
  const w = 320, h = 150, padL = 22, padR = 12, padT = 16, padB = 24;
  const maxY = Math.max(...series.map((p) => p.y));
  const n = series.length;
  const stepX = (w - padL - padR) / (n - 1);
  const pts = series.map((p, i) => ({
    x: padL + i * stepX,
    y: padT + (h - padT - padB) * (1 - p.y / maxY),
    label: p.x, val: p.y,
  }));
  const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const area = path + ' L' + pts[n - 1].x.toFixed(1) + ',' + (h - padB) + ' L' + pts[0].x.toFixed(1) + ',' + (h - padB) + ' Z';
  const dots = pts.map((p) => '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.5" style="fill:' + palette.accent + '"></circle>').join('');
  const showLabel = (i) => i === 0 || i === n - 1 || n <= 6;
  const labels = pts.map((p, i) => showLabel(i) ? '<text x="' + p.x.toFixed(1) + '" y="' + (h - 8) + '" font-size="9" text-anchor="middle" style="fill:' + palette.muted + '">' + esc(p.label.slice(5)) + '</text>' : '').join('');
  const gridLine = '<line x1="' + padL + '" y1="' + (h - padB) + '" x2="' + (w - padR) + '" y2="' + (h - padB) + '" style="stroke:' + palette.grid + '" stroke-width="1"></line>';
  return '<div class="chart-block"><div class="chart-title">' + title + '</div><svg viewBox="0 0 ' + w + ' ' + h + '" class="chart-svg" style="max-width:100%">' +
    gridLine +
    '<path d="' + area + '" style="fill:' + palette.accent + '" opacity="0.12"></path>' +
    '<path d="' + path + '" style="fill:none;stroke:' + palette.accent + '" stroke-width="2.5" stroke-linecap="round"></path>' +
    dots + labels +
    '</svg></div>';
}

function buildStatusPie(palette) {
  const counts = { pending: 0, active: 0, done: 0 };
  state.steps.forEach((s) => { counts[s.status] = (counts[s.status] || 0) + 1; });
  const items = [
    { label: '未着手', value: counts.pending, color: palette.pending },
    { label: '進行中', value: counts.active, color: palette.active },
    { label: '完了', value: counts.done, color: palette.done },
  ];
  return pieChartHTML(items, '🟢 工程ステータス比率', palette);
}
function buildCounterBar(palette) {
  const items = state.counters.map((c, i) => ({ label: c.label, value: c.value, color: palette.categorical[i % palette.categorical.length] }));
  return barChartHTML(items, '📊 カウンター集計', palette);
}
function buildProgressLine(palette) {
  const series = state.steps
    .filter((s) => s.status === 'done' && s.end)
    .map((s) => ({ x: s.end }))
    .sort((a, b) => a.x.localeCompare(b.x))
    .map((p, i) => ({ x: p.x, y: i + 1 }));
  return lineChartHTML(series, '📈 完了ステップ数の累積推移', palette);
}

async function exportPlan() {
  const rows = state.steps.map((s, i) =>

  ).join('');
  const html = '<!doctype html><html><head><meta charset="utf-8">' + docStyle() + '</head><body>' +

    '<p><b>テーマ：</b>' + esc(state.theme || '（未設定）') + '　<b>テンプレート：</b>' + esc(TEMPLATES[state.templateId]?.name || '') + '</p>' +
    '<h2>工程一覧</h2><table><tr><th>#</th><th>工程</th><th>状態</th><th>開始日</th><th>完了日</th></tr>' + rows + '</table>' +
    '<h2>現在の状況（グラフ）</h2><div class="charts-grid">' + buildStatusPie(STATIC_PALETTE) + '</div>' +

    '</body></html>';
  await saveFile((state.theme || '業務計画書') + '_業務計画書.html', html);
}

async function exportReport() {
  const doneCount = state.steps.filter((s) => s.status === 'done').length;
  const pct = state.steps.length ? Math.round((doneCount / state.steps.length) * 100) : 0;
  const rows = state.steps.map((s, i) =>
    '<tr><td>' + (i + 1) + '</td><td>' + esc(s.label) + '</td><td><span class="pill ' + s.status + '">' + statusLabel(s.status) + '</span></td><td>' + (s.start || '—') + '</td><td>' + (s.end || '—') + '</td></tr>'
  ).join('');
  const charts = buildStatusPie(STATIC_PALETTE) + buildCounterBar(STATIC_PALETTE) + buildProgressLine(STATIC_PALETTE);
  const html = '<!doctype html><html><head><meta charset="utf-8">' + docStyle() + '</head><body>' +

    '<p><b>テーマ：</b>' + esc(state.theme || '（未設定）') + '　<b>全体進捗：</b>' + pct + '%（' + doneCount + '/' + state.steps.length + '）</p>' +
    '<h2>工程状況</h2><table><tr><th>#</th><th>工程</th><th>状態</th><th>開始日</th><th>完了日</th></tr>' + rows + '</table>' +
    '<h2>グラフでみる進捗</h2><div class="charts-grid">' + charts + '</div>' +

    '</body></html>';
  await saveFile((state.theme || '業務報告書') + '_業務報告書.html', html);

async function exportCsv() {
  const lines = ['種別,項目,状態または値,開始日,完了日'];
  state.steps.forEach((s) => lines.push(['工程', s.label, statusLabel(s.status), s.start, s.end].map(csvCell).join(',')));
  state.counters.forEach((c) => lines.push(['カウンター', c.label, c.value, '', ''].map(csvCell).join(',')));
  const csv = '﻿' + lines.join('\r\n');
  await saveFile((state.theme || '進捗データ') + '_進捗データ.csv', csv);
}
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

async function saveFile(filename, data) {
  if (!downloadsCap) {
    alertFallback('この表示環境ではファイル書き出しに対応していません。');
    return;
  }
  try {
    await downloadsCap.save({ filename, data });
  } catch (e) {
    // declined / rate_limited / etc. — silent is fine, viewer already saw the native prompt or decline
  }
}
function alertFallback(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:999;';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ---- render ----
function statusMeta(status) {
  if (status === 'done') return { label: '完了', cls: 'done' };
  if (status === 'active') return { label: '進行中', cls: 'active' };
  return { label: '未着手', cls: 'pending' };
}

function counterRow(c) {
  return '<div class="counter-row">' +
    '<input class="counter-label-input" data-action="set-counter-label" data-id="' + c.id + '" value="' + esc(c.label) + '" ' + (readOnly ? 'disabled' : '') + ' maxlength="40">' +
    '<div class="counter-controls">' +
    '<button class="btn btn-icon" data-action="counter-minus" data-id="' + c.id + '" ' + (readOnly ? 'disabled' : '') + '>−</button>' +
    '<span class="counter-value">' + c.value + '</span>' +
    '<button class="btn btn-icon" data-action="counter-plus" data-id="' + c.id + '" ' + (readOnly ? 'disabled' : '') + '>＋</button>' +
    '<button class="btn btn-ghost" data-action="delete-counter" data-id="' + c.id + '" ' + (readOnly ? 'disabled' : '') + '>' + (armed === 'delete-counter:' + c.id ? '本当に削除？' : '🗑') + '</button>' +
    '</div></div>';
}

    '<header class="header"><div class="header-top">' +

      '<button class="btn btn-danger-outline" data-action="reset-progress" ' + (readOnly ? 'disabled' : '') + '>' + (armed === 'reset:progress' ? '本当にリセット？（もう一度押す）' : '② 全体進捗をリセット') + '</button>' +

      '</div>' +
    '</section>' +

    '<details class="card guide"><summary>📘 使い方・保存場所・情報の取り扱いについて（手順書）</summary><div class="guide-body">' +
      '<div class="guide-grid">' +
        '<div><h4>①基本操作</h4><ul>' +
          '<li>「開始する」でステップを進行中にします。</li>' +
          '<li>「完了する」は2回押しで確定する安全策つきで、押すと<b>その場所には戻れません</b>（履歴として固定されます）。</li>' +
          '<li>進行中のステップだけ「未着手に戻す」で戻せます。</li>' +
          '<li>ステップ名はいつでも書き換えられます（進行には影響しません）。</li>' +
        '</ul></div>' +
        '<div><h4>②ステップ構成の一般化</h4><ul>' +
          '<li>上部のボタンでテンプレート（CAE解析・商談・資料作成・汎用）を切り替えられます。切替は進捗をリセットするため2回押し確認が必要です。</li>' +
          '<li>「＋ステップを追加」「▲▼で並べ替え」「🗑削除（未着手のみ）」で、好きな業務フローに合わせて自由に編集できます。</li>' +
        '</ul></div>' +
        '<div><h4>③カウンターとリセット</h4><ul>' +
          '<li>カウンターは名前も含めて自由に追加・編集・削除でき、<b>完了しても絶対にロックされません</b>。</li>' +
          '<li><code>① カウンターをリセット</code>：すべてのカウンター値を0に戻します（ステップ進捗には影響しません）。</li>' +
          '<li><code>② 全体進捗をリセット</code>：すべてのステップを「未着手」に戻します（カウンター値には影響しません）。</li>' +
          '<li>新しいテーマを始めるときは、テーマ名を書き換え、①②を両方押して0%の状態から始めてください。</li>' +
        '</ul></div>' +
        '<div><h4>④保存場所・起動方法</h4><ul>' +
          '<li>これはファイルではなく、claude.ai上の「Artifact（アーティファクト）」という固定リンクを持つページです。パソコンのフォルダには保存されません。</li>' +
          '<li>起動方法：claude.aiの「Artifacts」一覧からこのページを開くか、このチャットで表示されたリンクをブックマークしてアクセスしてください。どの端末からでも同じリンクで同じデータが開きます。</li>' +
          '<li>入力した内容はこのページ自体に保存され（自動保存）、リロードしても消えません。</li>' +
        '</ul></div>' +
        '<div><h4>⑤共有と情報漏洩対策</h4><ul>' +
          '<li>既定では非公開です。共有する場合は「編集可能」な相手にのみデータが表示される設定にしてあり、リンクを知っているだけの閲覧者には進行データが表示されません。</li>' +
          '<li>それでも、テーマ名・ステップ名・カウンター名などの自由入力欄には、<b>実際の顧客名・金額・機密情報は入力しない</b>ことを推奨します（抽象的な名称での管理を推奨）。</li>' +
          '<li>出力ファイル（計画書・報告書・CSV）はこの端末内で生成され、外部サーバーには送信されません。</li>' +
        '</ul></div>' +
        '<div><h4>⑥出力について</h4><ul>' +
          '<li>「業務計画書」「業務報告書」「進捗データ」は、実際のWord/Excelファイルではなく、同等に開ける .html / .csv 形式です。</li>' +
          '<li>Word/Excelで開いて、そのまま編集・保存できます。</li>' +
        '</ul></div>' +
      '</div>' +
    '</div></details>' +

    '<footer class="app-footer">業務進行トラッカー — どんな業務の進行管理にも使える汎用ダッシュボード</footer>';
}

// ---- events (delegated once on the stable root) ----
root.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.tagName !== 'BUTTON') return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  switch (action) {
    case 'start-step': startStep(id); break;
    case 'complete-step': completeStep(id); break;
    case 'revert-step': revertStep(id); break;
    case 'add-step': addStep(); break;
    case 'delete-step': deleteStep(id); break;
    case 'move-step-up': moveStep(id, -1); break;
    case 'move-step-down': moveStep(id, 1); break;
    case 'apply-template': applyTemplate(id); break;
    case 'counter-plus': bumpCounter(id, 1); break;
    case 'counter-minus': bumpCounter(id, -1); break;
    case 'add-counter': addCounter(); break;
    case 'delete-counter': deleteCounter(id); break;
    case 'reset-counters': resetCounters(); break;
    case 'reset-progress': resetProgress(); break;
    case 'export-plan': exportPlan(); break;
    case 'export-report': exportReport(); break;
    case 'export-csv': exportCsv(); break;
  }
});
root.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.action === 'set-date') setStepDate(el.dataset.id, el.dataset.field, el.value);
});
root.addEventListener('focusout', (e) => {
  const el = e.target;
  if (!el.dataset) return;
  if (el.id === 'theme-input') setTheme(el.value);
  if (el.dataset.action === 'set-step-label') setStepLabel(el.dataset.id, el.value);
  if (el.dataset.action === 'set-counter-label') setCounterLabel(el.dataset.id, el.value);
});

// ---- init ----
async function init() {
  render();
  db = await window.claude.use('db');
  userCap = await window.claude.use('user');
  downloadsCap = await window.claude.use('downloads');
  dbAvailable = !!db;

  if (db) {
    const ref = db.doc('state/current');
    ref.onSnapshot(
      (snap) => {
        // Ignore snapshots that arrive while we have our own write in
        // flight — an in-flight write can be superseded by a snapshot
        // that still reflects the pre-write server state, which would
        // otherwise silently erase whatever the user just added/changed.
        if (pendingWrites > 0) return;
        const data = snap && snap.exists ? snap.data() : null;
        if (data && Array.isArray(data.steps)) {
          state = data;
        }
        render();
      },
      (err) => {
        if (err && (err.code === 'revoked')) { readOnly = true; render(); }
      }
    );
  }
}
init();
</script>
